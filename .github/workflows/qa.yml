name: Full QA & Acceptance Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  qa-suite:
    name: Run Full QA Suite & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      ENABLE_TUNNEL: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Pytest Test Suites (Unit, Database, Security, API, Parser)
        run: |
          python -m pytest \
            tests/test_database.py \
            tests/test_api.py \
            tests/test_authorization_isolation.py \
            tests/test_download_security.py \
            tests/test_ai_resilience.py \
            tests/test_kai_api.py \
            tests/test_scheduler_unit.py \
            tests/test_tasks_handlers.py \
            tests/test_reproducibility.py \
            -v

      - name: Run Master E2E & Functional QA Runner (Local Mode)
        run: |
          python scripts/run_full_qa.py --mode local --headless

      - name: Upload QA Artifacts and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            artifacts/qa/
            docs/FULL_QA_REPORT.md
            docs/FUNCTION_INVENTORY.md
            docs/FULL_QA_FIX_PLAN.md
          if-no-files-found: ignore
